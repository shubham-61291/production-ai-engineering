services:
  api:
    image: ${REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/magnetar-images/magnetar-api:latest
    container_name: magnetar-api
    expose:
      - "8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - OLLAMA_URL=${OLLAMA_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME}
      - API_KEY=${API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - INPUT_GUARD_MODEL_PATH=${INPUT_GUARD_MODEL_PATH}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-50}
      - DEFAULT_TEMPERATURE=${DEFAULT_TEMPERATURE}
      - DEFAULT_SEED=${DEFAULT_SEED}
      - DEFAULT_MAX_TOKENS=${DEFAULT_MAX_TOKENS}
      - CACHE_TTL=${CACHE_TTL}
      - CHROMA_PERSIST_DIR=${CHROMA_PERSIST_DIR:-./chroma_data}
      - BM25_DATA_DIR=${BM25_DATA_DIR:-./bm25_data}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-10}
    volumes:
      - ./models:/app/models
      - ./chroma_data:/app/chroma_data
      - ./bm25_data:/app/bm25_data
    depends_on:
      - redis
      - jaeger
    restart: unless-stopped
    networks:
      - magnetar-net
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'

  redis:
    image: redis:7-alpine
    container_name: magnetar-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - magnetar-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: magnetar-jaeger
    expose:
      - "4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - jaeger_data:/badger
    restart: unless-stopped
    networks:
      - magnetar-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  nginx:
    image: nginx:alpine
    container_name: magnetar-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx.conf.template:/etc/nginx/conf.d/default.conf.template:ro
      - ./certificates:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - ./nginx-startup.sh:/docker-entrypoint.d/99-startup.sh:ro
    tmpfs:
      - /reload:size=64k
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      - api
    networks:
      - magnetar-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'

  certbot:
    image: certbot/certbot:latest
    container_name: magnetar-certbot
    volumes:
      - ./certificates:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - ./certbot-renew.sh:/certbot-renew.sh:ro
    environment:
      - DOMAIN=${DOMAIN}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
    entrypoint: /bin/sh
    command: /certbot-renew.sh
    depends_on:
      - nginx
    networks:
      - magnetar-net

volumes:
  redis_data:
  jaeger_data:
  certbot_www:

networks:
  magnetar-net:
    driver: bridge
